[package]
name = "veyra-layout"
description = "Veyra's layout engine: box trees, block/inline formatting, intrinsic sizing (ADR-0003, dependency-graph §1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Boundary justification (docs/architecture/dependency-graph.md §1): layout
# consumes computed styles (LAYOUT --> STYLE) and the DOM tree (via the style
# map's node ids); it depends on no service crate and performs no I/O. Text
# measurement goes through the `TextMeasurer` seam; the dependency-graph edge
# LAYOUT --> TEXT is realized here against `veyra-text` (ADR-0015):
# `ShapedMetrics` wraps the font library and shapes runs for real metrics,
# while `FixedMetrics` — the deterministic, fully specified fixed-advance
# provider — remains the fallback and the golden-fixture provider.
#
# Roadmap phase: 3. ADR-0003 (rendering architecture: custom block+inline
# layout, taffy deferred to the flexbox batch), ADR-0014 (Phase 3 entry
# spike), ADR-0015 (text stack adoption), docs/architecture/dependency-graph.md
# §1 (LAYOUT/TEXT rows), docs/architecture/rendering-pipeline.md §2–3.

[dependencies]
veyra-dom = { path = "../veyra-dom", version = "0.1.0" }
veyra-style = { path = "../veyra-style", version = "0.1.0" }
veyra-text = { path = "../veyra-text", version = "0.1.0" }

# Doc tests and unit tests build full documents end-to-end (parse → style
# → layout); they are test-surface consumers, not engine edges.
# Versioned path deps (deny.toml bans wildcards) — publishable crate graph.
[dev-dependencies]
veyra-dom = { path = "../veyra-dom", version = "0.1.0" }
veyra-html = { path = "../veyra-html", version = "0.1.0" }
veyra-url = { path = "../veyra-url", version = "0.1.0" }

[lints]
workspace = true
