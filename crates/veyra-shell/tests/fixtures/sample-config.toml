# Phase 1 sample configuration — parsed by unit tests (`config.rs`) and the
# benchmark fixture (`benches/phase1.rs`). Documents the schema by example:
# every key is optional; unknown keys are rejected; `[policy]` is reserved
# and must stay empty in this phase.

schema_version = 1

[window]
width = 800
height = 600

[render]
scene = "diagnostic"

[diagnostics]
level = "debug"

[policy]
# Reserved for Phase 6+ enterprise policy. Keys here are rejected, not
# ignored: nothing silently accepted.
