[package]
name = "veyra-net"
description = "Veyra's network service: policy layer over hyper/rustls/hickory — fetch, redirects, cookies, limits (ADR-0008)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Boundary justification (docs/architecture/dependency-graph.md §4/§5):
# veyra-net owns the policy layer over the transport stack adopted by
# ADR-0008 (hyper 1.x HTTP/1.1, rustls TLS, hickory DNS, tokio runtime).
# Transport types never appear in public APIs (§5 isolation table);
# callers see Veyra's Request/LoadedResource/NetError/CookieJar only.
# veyra-net never imports content-layer crates (invariant 4): documents
# are bytes here; parsing happens in veyra-html.
#
# Roadmap phase: 2. ADR-0008; engineering standards §5 (services use
# tokio; engine core stays synchronous — the `blocking` module is the
# bridge for the shell's worker threads), §6 (limits table owner for
# response body / redirect chain / header count+size).

[dependencies]
veyra-url = { path = "../veyra-url", version = "0.1.0" }
hyper = { version = "1.8", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "webpki-roots", "native-tokio", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
tokio = { version = "1.48", features = ["rt", "net", "time", "sync", "io-util"] }
http = "1.3"
http-body-util = "0.1"
bytes = "1.11"
tower-service = "0.3"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "net", "time", "sync", "io-util", "macros"] }

[lints]
workspace = true
