# Boundary justification (docs/architecture/dependency-graph.md §4): veyra-dom
# is the system's stable core and depends on nothing in the engine except
# veyra-url (invariant 2: "origins live on nodes"). Node storage is an
# arena with generational ids — the shape future GC integration (Phase 5)
# and the binding generator build on — with a normative node-count limit
# (engineering standards §6). No external dependencies.
#
# Roadmap phase: 2. ADR-0003 (content layer), docs/architecture/
# dependency-graph.md §1 (DOM node), docs/engineering/engineering-standards.md
# §6 (node-count limit ownership).

