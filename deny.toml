# cargo-deny configuration for Veyra.
#
# Policy: Apache-2.0 project. Dependencies must be permissive licenses usable
# in a browser engine without copyleft obligations beyond file-level.
# MPL-2.0 (cssparser/selectors, Phase 3 per ADR-0003/0014 — file-level
# license isolation and NOTICE discipline) enters the allow list together
# with those crates at adoption.
# Language rules (no C/C++ subsystems) are enforced in review; this file is the
# license/supply-chain gate. See docs/research/dependency-and-license-audit.md.

[graph]
all-features = true

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  # ADR-0013 (Phase 2 document pipeline): webpki-roots bundles Mozilla's CA
  # store (CDLA-Permissive-2.0) as Veyra's Phase 2 TLS trust roots.
  # (ring 0.17.14, the rustls provider, publishes "Apache-2.0 AND ISC" —
  # the historical OpenSSL advertising clause is gone from its expression,
  # so no OpenSSL allowance is needed.)
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
