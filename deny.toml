# cargo-deny configuration for Veyra.
#
# Policy: Apache-2.0 project. Dependencies must be permissive licenses usable
# in a browser engine without copyleft obligations beyond file-level (MPL-2.0
# is deliberately NOT in the allow list yet — the stylo/cssparser/selectors
# family is MPL-2.0 and requires ADR-0003/ADR-0010 evaluation before adoption).
# Language rules (no C/C++ subsystems) are enforced in review; this file is the
# license/supply-chain gate. See docs/research/dependency-and-license-audit.md.

[graph]
all-features = true

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
