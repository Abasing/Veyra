name: Bug report
description: Report a problem with the repository, tooling, or (later) engine behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Veyra is in the research/foundation stage — there is no browser to use yet.
        Most "bugs" at this stage are documentation, tooling, or CI issues.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Tooling (veyra-doctor / link checkers)
        - CI / workflows
        - Build / toolchain
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Expected vs. actual behavior.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit hash
      placeholder: "e.g. 2da5030"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Commands run and full output where possible. Deterministic reproductions only.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, test output, or screenshots supporting the report.
