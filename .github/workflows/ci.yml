name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

# Least privilege: read-only on contents; no secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-checks:
    name: Repository & docs invariants (veyra-doctor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (reads rust-toolchain.toml)
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run veyra-doctor
        run: cargo run --locked -p veyra-doctor

  rust:
    name: Rust (fmt, clippy, test, doc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (reads rust-toolchain.toml)
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Doc links
        run: cargo doc --workspace --no-deps
      # Tests run in the headless-shell job under Xvfb: the workspace suite
      # includes the window smoke tests, which require a display server and
      # fail loudly without one. Keeping them here (no display) would be red
      # every run; skipping them silently would be dishonest. Under Xvfb
      # every test in the workspace genuinely executes on every push.

  python-tools:
    name: Python tooling (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest ruff
      - name: Lint (ruff)
        run: python3 -m ruff check tools/ tests/
      - name: Tests (pytest)
        run: python3 -m pytest tests/ -q

  headless-shell:
    name: Phase 1 shell (xvfb window smoke + deterministic rendering)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (reads rust-toolchain.toml)
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install X libraries for the headless window test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0
      - name: Build shell
        run: cargo build --locked -p veyra-shell
      - name: Workspace tests under Xvfb (includes window smoke)
        # Every test runs for real here: CPU-rendering/golden/CLI tests do
        # not need the display; the window smoke tests do and get one.
        # Nothing is skipped on CI.
        run: xvfb-run -a cargo test --workspace
      - name: Screenshot CLI repeatability (no display server)
        run: |
          target/debug/veyra-shell screenshot --output "$RUNNER_TEMP/shot-a.png" > "$RUNNER_TEMP/report-a.txt"
          target/debug/veyra-shell screenshot --output "$RUNNER_TEMP/shot-b.png" > "$RUNNER_TEMP/report-b.txt"
          h1="$(sed -n 's/^pixels-hash=sha256://p' "$RUNNER_TEMP/report-a.txt")"
          h2="$(sed -n 's/^pixels-hash=sha256://p' "$RUNNER_TEMP/report-b.txt")"
          echo "hash-a=$h1"
          echo "hash-b=$h2"
          test -n "$h1" && test -n "$h2" && test "$h1" = "$h2"
          test -f "$RUNNER_TEMP/shot-a.png" && test -f "$RUNNER_TEMP/shot-b.png"

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
